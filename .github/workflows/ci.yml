name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release check
        run: npm run release-check

      - name: Lighthouse runtime smoke
        run: |
          node --input-type=module <<'NODE'
          import { createServer } from 'node:http';
          import { runLighthouseAudit } from './dist/lighthouse.js';
          const server = createServer((_request, response) => {
            response.setHeader('content-type', 'text/html');
            response.end('<!doctype html><html lang="en"><head><title>Audit smoke</title><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><main><h1>Audit smoke</h1></main></body></html>');
          });
          await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
          try {
            const report = await runLighthouseAudit(`http://127.0.0.1:${server.address().port}/`, { timeoutMs: 10000 });
            for (const name of ['performance', 'accessibility', 'bestPractices', 'seo']) {
              if (!Number.isFinite(report.categories[name])) throw new Error(`Missing Lighthouse score: ${name}`);
            }
            console.log(JSON.stringify(report.categories));
          } finally {
            await new Promise(resolve => server.close(resolve));
          }
          NODE
